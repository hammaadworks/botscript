[project]
name = "wgetube"
version = "1.0.0"
description = "Professional Terminal Media Hub: Download, Loop, and Clip."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2025.2.19",
    "textual>=0.85.0",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "python-vlc>=3.0.20123",
    "ffmpeg-python>=0.2.0",
    "questionary>=2.0.1",
]

[tool.uv]
managed = true

[project.scripts]
wgetube = "cli.main:app"
